name: Mobile quality and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Public version, for example 1.0.0
        required: true
        default: 1.0.0
      build_number:
        description: Monotonically increasing store build number
        required: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  android-preview:
    name: Android release preview
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned preview bundle
        env:
          BUILD_UNSIGNED: "true"
        run: >-
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios-preview:
    name: iOS no-codesign archive check
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Resolve iOS packages without the shared repository cache
        run: |
          export PATH="/usr/bin:$PATH"
          for i in 1 2 3; do
            echo "Resolving iOS package dependencies (attempt $i)..."
            if xcodebuild -resolvePackageDependencies \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -clonedSourcePackagesDirPath "$PWD/build/ios/SourcePackages" \
              -disablePackageRepositoryCache \
              -scmProvider system; then
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, cleaning and retrying in 5 seconds..."
              rm -rf "$PWD/build/ios/SourcePackages"
              sleep 5
            else
              echo "Failed to resolve iOS packages after 3 attempts."
              exit 1
            fi
          done
      - name: Build no-codesign iOS archive
        run: |
          export PATH="/usr/bin:$PATH"
          flutter build ios --release --no-codesign

  web-preview:
    name: WASM web build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release --wasm

  android-store:
    name: Signed Android store bundle
    if: github.event_name == 'workflow_dispatch'
    needs: [quality, android-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Configure production upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            printf 'storeFile=release.jks\n'
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
          } > android/key.properties
      - name: Build signed store bundle
        run: >-
          flutter build appbundle --release
          --build-name=${{ inputs.release_version }}
          --build-number=${{ inputs.build_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: flute-practice-coach-${{ inputs.release_version }}-${{ inputs.build_number }}.aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
