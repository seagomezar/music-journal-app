name: Platform journeys
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            flutter test integration_test/app_smoke_test.dart -d emulator-5554 --dart-define=FLUTE_SKIP_NATIVE_AUDIO=true
            flutter test integration_test/ios_feature_suite_test.dart -d emulator-5554
            flutter test integration_test/recovery_journey_test.dart -d emulator-5554
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Boot an available iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'puts JSON.parse(STDIN.read)["devices"].values.flatten.find { |d| d["name"].include?("iPhone") }.fetch("udid")')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - run: flutter test integration_test/app_smoke_test.dart -d "$SIMULATOR_ID" --dart-define=FLUTE_SKIP_NATIVE_AUDIO=true
      - run: flutter test integration_test/ios_feature_suite_test.dart -d "$SIMULATOR_ID"
      - run: flutter test integration_test/recovery_journey_test.dart -d "$SIMULATOR_ID"
